spring.application.name=homologacao

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homologacao}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-with-at-least-64-bytes-change-before-production-123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

app.email.remetente=${APP_EMAIL_REMETENTE:${spring.mail.username}}
app.email.alertas.implantacao.destinatarios=${APP_EMAIL_ALERTAS_IMPLANTACAO_DESTINATARIOS:}
app.implantacao.validacao.cron=${APP_IMPLANTACAO_VALIDACAO_CRON:0 0 8 * * ?}
app.implantacao.validacao.zone=${APP_IMPLANTACAO_VALIDACAO_ZONE:America/Sao_Paulo}
app.icho.evidencias.storage-dir=${APP_ICHO_EVIDENCIAS_STORAGE_DIR:uploads/icho-evidencias}
app.icho.evidencias.max-size-bytes=${APP_ICHO_EVIDENCIAS_MAX_SIZE_BYTES:10485760}
app.icho.evidencias.allowed-content-types=${APP_ICHO_EVIDENCIAS_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/webp,application/pdf}

app.ia.api-key=${AI_API_KEY:}
app.ia.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ia.model=${AI_MODEL:gpt-4o-mini}
